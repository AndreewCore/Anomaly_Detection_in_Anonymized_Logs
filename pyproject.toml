[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anonlogs"
version = "0.1.0"
description = "Efectos de la anonimización en la detección de anomalías en logs SSH de Linux"
requires-python = ">=3.14"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
