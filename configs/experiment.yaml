# Parámetros fijos del experimento. Lo que varía entre runs va en matrix_*.yaml.
# Las claves marcadas DECISIÓN están pendientes de acordar en grupo (docs/diseno_experimento.md).

paths:
  raw: data/raw
  ground_truth: data/ground_truth
  interim: data/interim            # interim/<dataset>/
  processed: data/processed        # processed/<dataset>/<tratamiento>/<campo>/
  features: data/features          # features/<dataset>/<tratamiento>-<campo>/w<ventana>/
  runs: results/runs
  tables: results/tables
  figures: results/figures

datasets:
  lab_concentrado:   {source: lab,    path: raw/lab/concentrado,  ground_truth: ground_truth/lab_concentrado.csv}
  lab_multi_cuenta:  {source: lab,    path: raw/lab/multi_cuenta, ground_truth: ground_truth/lab_multi_cuenta.csv}
  lab_distribuido:   {source: lab,    path: raw/lab/distribuido,  ground_truth: ground_truth/lab_distribuido.csv}
  lab_spraying:      {source: lab,    path: raw/lab/spraying,     ground_truth: ground_truth/lab_spraying.csv}
  loghub_openssh:    {source: loghub, path: raw/loghub,           ground_truth: null}   # sin etiquetas

# D1 (unidad de análisis) y D2 (regla de etiquetado) se prueban como ejes de la
# matriz (ver configs/matrix_*.yaml → units, labeling), para justificarlas con datos.

anonymization:
  suppression_token: "<SUPRIMIDO>"
  ipv4_prefix: 24
  hmac_digest_chars: 16            # longitud del seudónimo mostrado; el HMAC completo es SHA-256

split:
  method: temporal
  train_fraction: 0.6
  # DECISIÓN D4: si la parte de prueba queda sin ataques, splitting.py falla con un error claro.
  min_attack_units_in_test: 1

detectors:
  isolation_forest:
    n_estimators: 200
    max_samples: auto
    contamination: auto
  ssif:
    # D5 (tomada): IF entrenado solo con unidades normales del entrenamiento.
    variant: if_entrenado_en_normales
    n_estimators: 200
    max_samples: auto
    contamination: auto
  umbral:
    # Umbral por regla (criterio experto del equipo): la unidad es anómala si
    # alguna regla activa supera su umbral. Justificación en docs/diseno_experimento.md §6.
    fallos_por_ip: 10
    fallos_por_usuario: 10
    usuarios_unicos_por_ip: 5
    fallos_por_ventana: 30
  umbral_calibrado:
    # Mismo baseline, pero el umbral de cada regla sale del percentil de las
    # unidades normales de entrenamiento (menos arbitrario que el fijo).
    percentile: 99

stats:
  test: wilcoxon_pareado           # pareado por semilla
  correction: holm
  alpha: 0.05
