# Escenario distribuido: N IPs -> 1 cuenta.
# attacker_1 y attacker_2 comparten /24; attacker_3 no (contraste para ip_generalizada).
scenario: distribuido
compose_profile: distribuido
attackers: [attacker_1, attacker_2, attacker_3]
target_users: [admin]
passwords_per_user: 50
# Requisito de diseño: los ataques se reparten en varias ráfagas a lo largo de toda la captura,
# para que la partición temporal entrenamiento/prueba deje ataques en ambas partes
# (ver docs/diseno_experimento.md, decisión D4).
duration_minutes: 120          # TODO: confirmar con el grupo
bursts: 6                      # ráfagas de ataque repartidas en la captura
legit_traffic: true
