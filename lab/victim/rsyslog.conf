# Sin systemd/journald en el contenedor: rsyslog recibe por /dev/log y escribe auth.log.
module(load="imuxsock")
# imklog se omite: el contenedor no puede leer el log del kernel y rsyslog fallaría.

# Formato RFC 3339 (incluye año y zona horaria) para alinear sin ambigüedad con el Ground Truth.
# Ojo: Loghub usa el formato tradicional "Mmm dd hh:mm:ss"; el parser debe aceptar ambos.
$ActionFileDefaultTemplate RSYSLOG_FileFormat

auth,authpriv.*   /var/log/auth.log
